<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="description" content="ESP32-S3 四路藍牙繼電器控制中心">
<link rel="manifest" href="./manifest.json">
<title>CAR CONTROL | ESP32-S3</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--card:#121b2b;--blue:#4b8cff;--green:#18d69a;--red:#ff5d70;--text:#f3f7ff;--muted:#8d9bb2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px 32px;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(ellipse at top,#182c4c 0%,transparent 48%),var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.container{max-width:520px;margin:auto}header{padding:8px 2px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#438cff,#1c56d9);font-size:25px}h1{margin:0;font-size:22px;letter-spacing:1px}.subtitle{margin-top:5px;font-size:12px;color:var(--muted);letter-spacing:1.5px}
.panel{background:rgba(18,27,43,.92);border:1px solid #ffffff14;border-radius:22px;padding:20px;margin-bottom:16px}.section-label{margin:0 0 15px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.8px}.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.status-title{font-size:15px;font-weight:700}.status-subtitle{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:8px 11px;background:#ffb84d18;color:#ffbf69;font-size:12px;white-space:nowrap}.badge.online{color:var(--green);background:#18d69a18}.dot{width:7px;height:7px;background:currentColor;border-radius:50%}
.primary,.install{width:100%;border:0;border-radius:14px;padding:15px;margin-top:18px;color:white;background:linear-gradient(135deg,#438cff,#285de2);font-weight:750}.install{margin-top:10px;background:#263750}.hidden{display:none!important}.master{background:linear-gradient(145deg,#172944,#111a2a)}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{font-size:17px;margin:0}.heading span{color:var(--muted);font-size:12px}.master-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.master-btn{border:0;border-radius:14px;padding:15px 8px;font-weight:800;color:white}.on{background:linear-gradient(135deg,#13bb85,#078a65)}.off{background:linear-gradient(135deg,#ff6578,#d83d56)}
.grid-heading{margin:26px 2px 14px;display:flex;justify-content:space-between;align-items:center}.grid-heading h2{margin:0;font-size:17px}.grid-heading span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.relay{background:linear-gradient(145deg,#182438,#101827);border:1px solid #ffffff14;border-radius:20px;padding:17px;min-width:0}.relay.is-on{border-color:#18d69a70;background:linear-gradient(145deg,#16352f,#101e25)}.relay-top{display:flex;align-items:center;justify-content:space-between}.num{color:var(--muted);font-size:11px;letter-spacing:1.5px}.indicator{width:10px;height:10px;border-radius:50%;background:#596579}.relay.is-on .indicator{background:var(--green);box-shadow:0 0 14px #18d69a90}.relay h3{font-size:17px;margin:16px 0 6px}.state{color:var(--muted);font-size:12px;margin-bottom:16px}.relay.is-on .state{color:var(--green)}.switch{width:100%;border:1px solid #344157;border-radius:11px;background:#263247;color:#e5ebf5;padding:12px 5px;font-size:13px;font-weight:750}.relay.is-on .switch{border-color:#18d69a60;background:#18d69a17;color:var(--green)}.footer{text-align:center;color:#63718a;font-size:11px;line-height:1.8;padding:22px 8px 0}.toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:480px;margin:auto;padding:14px 16px;border:1px solid #ffffff14;border-radius:14px;background:#202d42;color:white;box-shadow:0 10px 35px #0006;font-size:13px;text-align:center;z-index:10}@media(max-width:360px){body{padding-left:12px;padding-right:12px}.panel{padding:16px}.relay{padding:13px}h1{font-size:19px}}
</style>
</head>
<body>
<main class="container">
<header><div class="brand"><div class="logo">⚡</div><div><h1>CAR CONTROL</h1><div class="subtitle">ESP32-S3 SMART SYSTEM</div></div></div></header>
<section class="panel">
<div class="section-label">DEVICE CONNECTION</div>
<div class="status-row"><div><div class="status-title">ESP32-S3 藍牙裝置</div><div class="status-subtitle" id="deviceName">尚未連接裝置</div></div><div class="badge" id="badge"><span class="dot"></span><span id="status">未連線</span></div></div>
<button class="primary" id="connect">連接 ESP32-S3</button>
<button class="install hidden" id="install">＋ 安裝到手機主畫面</button>
</section>
<section class="panel master"><div class="heading"><h2>全車控制</h2><span id="masterState">等待連線</span></div><div class="master-buttons"><button class="master-btn on" id="allOn" disabled>⚡ 全部開啟</button><button class="master-btn off" id="allOff" disabled>◯ 全部關閉</button></div></section>
<div class="grid-heading"><h2>裝置控制</h2><span id="count">0 / 4 開啟</span></div><section class="grid" id="grid"></section>
<footer class="footer">SMART VEHICLE CONTROL SYSTEM<br>ESP32-S3 · BLE · FOUR-CHANNEL RELAY</footer>
</main><div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
const SERVICE_UUID="12345678-1234-5678-1234-56789abcdef0";
const CHARACTERISTIC_UUID="12345678-1234-5678-1234-56789abcdef1";
const states=[false,false,false,false];let device=null,characteristic=null,connected=false,busy=false,installPrompt=null,toastTimer=null;
const enc=new TextEncoder(),$=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function render(){ $("status").textContent=connected?"已連線":"未連線";$("badge").classList.toggle("online",connected);$("deviceName").textContent=connected&&device?(device.name||"ESP32-S3"):"尚未連接裝置";$("connect").textContent=connected?"中斷連線":"連接 ESP32-S3";$("allOn").disabled=!connected||busy;$("allOff").disabled=!connected||busy;$("masterState").textContent=!connected?"等待連線":busy?"正在傳送指令":"控制已就緒";$("grid").innerHTML="";
states.forEach((on,i)=>{let card=document.createElement("article");card.className="relay"+(on?" is-on":"");card.innerHTML=`<div class="relay-top"><span class="num">CHANNEL 0${i+1}</span><span class="indicator"></span></div><h3>繼電器 ${i+1}</h3><div class="state">${on?"● 已開啟":"○ 已關閉"}</div><button class="switch" ${!connected||busy?"disabled":""}>${on?"關閉此路":"開啟此路"}</button>`;card.querySelector("button").onclick=()=>setRelay(i,!states[i]);$("grid").appendChild(card)});$("count").textContent=`${states.filter(Boolean).length} / 4 開啟`}
async function writeCommand(command){if(!connected||!characteristic||!device?.gatt?.connected)throw Error("藍牙尚未連線");let d=enc.encode(command);if(characteristic.writeValueWithResponse)await characteristic.writeValueWithResponse(d);else if(characteristic.writeValueWithoutResponse)await characteristic.writeValueWithoutResponse(d);else if(characteristic.writeValue)await characteristic.writeValue(d);else throw Error("此藍牙特徵值不支援寫入")}
async function setRelay(i,on){if(!connected||busy)return toast("請先連線並等待上一個指令完成");busy=true;render();try{await writeCommand(`R${i+1}:${on?1:0}`);states[i]=on;toast(`繼電器 ${i+1} 指令已傳送`)}catch(e){toast("傳送失敗："+e.message)}finally{busy=false;render()}}
async function setAll(on){if(!connected||busy)return toast("請先連接 ESP32-S3");busy=true;render();let done=0;try{for(let i=0;i<4;i++){await writeCommand(`R${i+1}:${on?1:0}`);states[i]=on;done++;render();if(i<3)await new Promise(r=>setTimeout(r,100))}toast(on?"四路開啟指令已全部傳送":"四路關閉指令已全部傳送")}catch(e){toast(`已傳送 ${done}/4 路；其餘失敗：${e.message}`)}finally{busy=false;render()}}
function disconnect(){connected=false;characteristic=null;states.fill(false);render();toast("藍牙已斷線")}
async function connect(){if(!navigator.bluetooth)return toast("此瀏覽器不支援 Web Bluetooth，請使用支援 BLE 的 Chrome");if(connected&&device?.gatt?.connected){device.gatt.disconnect();disconnect();return} $("connect").disabled=true;try{device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE_UUID]}]});device.addEventListener("gattserverdisconnected",disconnect);let server=await device.gatt.connect(),service=await server.getPrimaryService(SERVICE_UUID);characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);connected=true;render();toast("ESP32-S3 連線成功")}catch(e){connected=false;characteristic=null;render();toast("連線失敗："+e.message)}finally{$("connect").disabled=false}}
$("connect").onclick=connect;$("allOn").onclick=()=>setAll(true);$("allOff").onclick=()=>setAll(false);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("install").classList.remove("hidden")});
$("install").onclick=async()=>{if(!installPrompt)return toast("請使用 Chrome 選單中的安裝或加到主畫面");installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("install").classList.add("hidden")};
window.addEventListener("appinstalled",()=>{$("install").classList.add("hidden");toast("App 已安裝")});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.error("Service Worker 註冊失敗：",e)));
render();
</script>
</body></html>
