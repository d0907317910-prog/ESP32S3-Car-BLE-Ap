<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.json"><title>Ec電驅</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--line:#26364d;--text:#edf4ff;--muted:#a9b8cc;--green:#2bd576;--red:#ff5d6c;--blue:#5da9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1220,#111d30);color:var(--text);font-family:system-ui,sans-serif;padding:20px 14px 34px}main{max-width:560px;margin:auto}header{text-align:center;padding:12px 0 20px}h1{margin:0;font-size:27px;letter-spacing:2px}.sub,.status,.note,small,footer{color:var(--muted)}.sub{font-size:13px;margin-top:6px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;color:#07111d;background:#d9e6f7}button:disabled{opacity:.45}.primary{background:var(--blue);flex:1}.onall{background:var(--green);flex:1}.offall{background:var(--red);flex:1}.smallbtn{padding:9px 11px;min-height:38px;font-size:13px}.status{font-size:13px;margin-top:10px;word-break:break-word}h2{font-size:17px;margin:0 0 12px}.relay{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.relay:last-child{border:0}.pill{font-size:12px;border-radius:999px;padding:5px 9px;background:#25344a;color:var(--muted)}.pill.active{background:#16452f;color:#7bf0ae}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0c1524;color:var(--text);font:inherit}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkitem{display:flex;align-items:center;gap:9px;background:#0d1727;border:1px solid var(--line);border-radius:11px;padding:12px}.checkitem input{width:20px;height:20px;accent-color:var(--green)}.note{font-size:12px;line-height:1.6}.group{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d1727;margin-top:10px}.grouphead,.groupactions{display:flex;justify-content:space-between;gap:8px;align-items:center}.groupmembers{font-size:12px;color:var(--muted);margin:8px 0}.groupactions button{flex:1}footer{text-align:center;font-size:11px;padding:10px}
</style></head><body><main><header><h1>Ec電驅</h1><div class="sub">ESP32-S3 · BLE 四路控制</div></header>
<section class="card"><div class="row"><button id="connect" class="primary">連線藍牙</button><button id="disconnect" class="smallbtn" disabled>中斷連線</button></div><div id="status" class="status">尚未連線</div></section>
<section class="card"><h2>快速控制</h2><div class="row"><button id="allOn" class="onall" disabled>一鍵全開</button><button id="allOff" class="offall" disabled>一鍵全關</button></div><p class="note">全開／全關會依序傳送四路指令。</p></section>
<section class="card"><h2>各路繼電器</h2><div id="relays"></div></section>
<section class="card"><h2>自訂同時控制組合</h2><label class="note" for="groupName">組合名稱</label><input id="groupName" class="field" maxlength="24" placeholder="例如：夜間模式" style="margin:6px 0 12px"><div id="checks" class="checkgrid"></div><div class="row" style="margin-top:12px"><button id="saveGroup" class="primary">儲存組合</button><button id="clearChecks" class="smallbtn">清除勾選</button></div><p class="note">勾選要一起控制的繼電器並儲存。每組可獨立選擇「開啟所選」或「關閉所選」。組合只保存在目前手機的瀏覽器。</p><div id="groups"></div></section>
<section class="card"><h2>修改繼電器名稱</h2><div id="nameEditors"></div><div class="row"><button id="saveNames" class="primary">儲存名稱</button><button id="resetNames" class="smallbtn">恢復預設名稱</button></div></section><footer>請先在無負載環境測試。</footer></main>
<script>
const SU='12345678-1234-5678-1234-56789abcdef0', CU='12345678-1234-5678-1234-56789abcdef1';
const DEF=['繼電器 1','繼電器 2','繼電器 3','繼電器 4'], NK='car-control-relay-names-v1', GK='car-control-groups-v1';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
let names=load(NK,DEF.slice()),groups=load(GK,[]),device=null,server=null,char=null,states=[false,false,false,false];
const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(s){$('status').textContent=s}
function connected(v){$('connect').disabled=v;$('disconnect').disabled=!v;$('allOn').disabled=!v;$('allOff').disabled=!v;renderRelays();renderGroups()}
function renderRelays(){$('relays').innerHTML=names.map((n,i)=>`<div class="relay"><div><b>${esc(n)}</b><br><small>R${i+1}</small></div><span class="pill ${states[i]?'active':''}">${states[i]?'已開啟':'已關閉'}</span><button class="smallbtn" data-r="${i}" ${!char?'disabled':''}>${states[i]?'關閉':'開啟'}</button></div>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>send(+b.dataset.r,!states[+b.dataset.r]))}
function renderChecks(){$('checks').innerHTML=names.map((n,i)=>`<label class="checkitem"><input type="checkbox" value="${i}"><span>${esc(n)}</span></label>`).join('')}
function renderNames(){$('nameEditors').innerHTML=names.map((n,i)=>`<label class="note" for="n${i}">R${i+1}</label><input class="field nameField" id="n${i}" maxlength="24" value="${esc(n)}" style="margin:5px 0 10px">`).join('')}
function renderGroups(){$('groups').innerHTML=groups.length?groups.map((g,i)=>`<div class="group"><div class="grouphead"><b>${esc(g.name)}</b><button class="smallbtn" data-del="${i}">刪除</button></div><div class="groupmembers">包含：${g.relays.map(n=>esc(names[n])).join('、')}</div><div class="groupactions"><button class="onall" data-gon="${i}" ${!char?'disabled':''}>開啟所選</button><button class="offall" data-goff="${i}" ${!char?'disabled':''}>關閉所選</button></div></div>`).join(''):'<p class="note">尚未儲存組合。</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{groups.splice(+b.dataset.del,1);localStorage.setItem(GK,JSON.stringify(groups));renderGroups()});document.querySelectorAll('[data-gon]').forEach(b=>b.onclick=()=>runGroup(groups[+b.dataset.gon],true));document.querySelectorAll('[data-goff]').forEach(b=>b.onclick=()=>runGroup(groups[+b.dataset.goff],false))}
async function connect(){if(!navigator.bluetooth){status('瀏覽器不支援 Web Bluetooth，請用 Android Chrome 與 HTTPS 網站。');return}try{status('正在搜尋 ESP32-S3…');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'ESP'}],optionalServices:[SU]});device.addEventListener('gattserverdisconnected',()=>{char=null;server=null;connected(false);status('藍牙已中斷，請重新連線。')});server=await device.gatt.connect();let service=await server.getPrimaryService(SU);char=await service.getCharacteristic(CU);status('已連線：'+device.name);connected(true)}catch(e){char=null;connected(false);status('連線失敗：'+e.message)}}
async function disconnect(){try{if(device?.gatt?.connected)device.gatt.disconnect()}catch(e){}char=null;server=null;connected(false);status('已中斷連線')}
async function send(i,on){if(!char){status('尚未連線，請先連線藍牙。');return}try{let bytes=new TextEncoder().encode(`R${i+1}:${on?1:0}`);if(char.writeValueWithResponse)await char.writeValueWithResponse(bytes);else await char.writeValue(bytes);states[i]=on;renderRelays();renderGroups();status(`已送出 R${i+1}:${on?1:0}`)}catch(e){status('指令傳送失敗：'+e.message)}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function all(on){for(let i=0;i<4;i++){await send(i,on);await wait(120)}}
async function runGroup(g,on){if(!g||!g.relays.length){status('此組合沒有選擇繼電器。');return}for(const i of g.relays){await send(i,on);await wait(120)}}
$('connect').onclick=connect;$('disconnect').onclick=disconnect;$('allOn').onclick=()=>all(true);$('allOff').onclick=()=>all(false);
$('clearChecks').onclick=()=>document.querySelectorAll('#checks input').forEach(c=>c.checked=false);
$('saveGroup').onclick=()=>{let relays=[...document.querySelectorAll('#checks input:checked')].map(c=>+c.value),name=$('groupName').value.trim();if(!name)return alert('請輸入組合名稱。');if(!relays.length)return alert('請至少勾選一個繼電器。');groups.push({name,relays});localStorage.setItem(GK,JSON.stringify(groups));$('groupName').value='';document.querySelectorAll('#checks input').forEach(c=>c.checked=false);renderGroups()};
$('saveNames').onclick=()=>{names=[...document.querySelectorAll('.nameField')].map((f,i)=>f.value.trim()||`繼電器 ${i+1}`);localStorage.setItem(NK,JSON.stringify(names));renderRelays();renderChecks();renderNames();renderGroups();status('名稱已儲存。')};
$('resetNames').onclick=()=>{names=DEF.slice();localStorage.setItem(NK,JSON.stringify(names));renderRelays();renderChecks();renderNames();renderGroups()};
renderRelays();renderChecks();renderNames();renderGroups();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
