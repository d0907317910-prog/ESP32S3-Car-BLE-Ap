<body>
<main class="container">

<header>
  <div class="brand">
    <div class="logo">⚡</div>
    <div>
      <h1>CAR CONTROL</h1>
      <div class="subtitle">ESP32-S3 SMART SYSTEM</div>
    </div>
  </div>
</header>

<section class="panel">
  <div class="section-label">DEVICE CONNECTION</div>

  <div class="status-row">
    <div>
      <div class="status-title">ESP32-S3 藍牙裝置</div>
      <div class="status-subtitle" id="deviceName">
        尚未連接裝置
      </div>
    </div>

    <div class="status-badge" id="statusBadge">
      <span class="dot"></span>
      <span id="status">未連線</span>
    </div>
  </div>

  <button class="primary-btn" id="connectButton">
    連接 ESP32-S3
  </button>

  <button class="install-btn hidden" id="installButton">
    ＋ 安裝到手機主畫面
  </button>
</section>

<section class="panel master-panel">
  <div class="master-heading">
    <h2>全車控制</h2>
    <span id="masterState">等待連線</span>
  </div>

  <div class="master-buttons">
    <button class="master-btn on" id="allOn" disabled>
      ⚡ 全部開啟
    </button>

    <button class="master-btn off" id="allOff" disabled>
      ◯ 全部關閉
    </button>
  </div>
</section>

<div class="grid-heading">
  <h2>裝置控制</h2>
  <span id="relayCount">0 / 4 開啟</span>
</div>

<section class="grid" id="relayGrid"></section>

<footer class="footer">
  SMART VEHICLE CONTROL SYSTEM<br>
  ESP32-S3 · BLE · FOUR-CHANNEL RELAY
</footer>

</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

const SERVICE_UUID =
  "12345678-1234-5678-1234-56789abcdef0";

const CHARACTERISTIC_UUID =
  "12345678-1234-5678-1234-56789abcdef1";

const states = [false, false, false, false];

let device = null;
let characteristic = null;
let connected = false;
let busy = false;
let toastTimer = null;
let installPrompt = null;

const encoder = new TextEncoder();

const statusElement = document.getElementById("status");
const statusBadge = document.getElementById("statusBadge");
const deviceName = document.getElementById("deviceName");
const connectButton = document.getElementById("connectButton");
const installButton = document.getElementById("installButton");
const allOnButton = document.getElementById("allOn");
const allOffButton = document.getElementById("allOff");
const masterState = document.getElementById("masterState");
const relayGrid = document.getElementById("relayGrid");
const relayCount = document.getElementById("relayCount");
const toast = document.getElementById("toast");

function showToast(message) {
  toast.textContent = message;
  toast.classList.remove("hidden");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.add("hidden");
  }, 2800);
}

function updateConnectionUI() {
  statusElement.textContent = connected ? "已連線" : "未連線";
  statusBadge.classList.toggle("online", connected);

  deviceName.textContent =
    connected && device
      ? device.name || "ESP32-S3"
      : "尚未連接裝置";

  connectButton.textContent = connected
    ? "中斷連線"
    : "連接 ESP32-S3";

  allOnButton.disabled = !connected || busy;
  allOffButton.disabled = !connected || busy;

  masterState.textContent = !connected
    ? "等待連線"
    : busy
      ? "正在傳送指令"
      : "控制已就緒";

  renderRelays();
}

function renderRelays() {
  relayGrid.innerHTML = "";

  states.forEach((isOn, index) => {
    const card = document.createElement("article");
    card.className = "relay" + (isOn ? " is-on" : "");

    const top = document.createElement("div");
    top.className = "relay-top";

    const number = document.createElement("span");
    number.className = "relay-number";
    number.textContent = `CHANNEL 0${index + 1}`;

    const indicator = document.createElement("span");
    indicator.className = "relay-indicator";

    top.append(number, indicator);

    const title = document.createElement("h3");
    title.textContent = `繼電器 ${index + 1}`;

    const description = document.createElement("div");
    description.className = "relay-state";
    description.textContent = isOn ? "● 已開啟" : "○ 已關閉";

    const button = document.createElement("button");
    button.className = "switch-btn";
    button.textContent = isOn ? "關閉此路" : "開啟此路";
    button.disabled = !connected || busy;

    button.addEventListener("click", () => {
      setRelay(index, !states[index]);
    });

    card.append(top, title, description, button);
    relayGrid.appendChild(card);
  });

  const count = states.filter(Boolean).length;
  relayCount.textContent = `${count} / 4 開啟`;
}

async function writeCommand(command) {
  if (!connected || !characteristic || !device?.gatt?.connected) {
    throw new Error("藍牙尚未連線");
  }

  const data = encoder.encode(command);

  if (typeof characteristic.writeValueWithResponse === "function") {
    await characteristic.writeValueWithResponse(data);
  } else if (typeof characteristic.writeValueWithoutResponse === "function") {
    await characteristic.writeValueWithoutResponse(data);
  } else if (typeof characteristic.writeValue === "function") {
    await characteristic.writeValue(data);
  } else {
    throw new Error("此藍牙特徵值不支援寫入");
  }
}

async function setRelay(index, nextState) {
  if (!connected || busy) {
    showToast("請先連接裝置，並等待上一個指令完成");
    return;
  }

  busy = true;
  updateConnectionUI();

  try {
    const command = `R${index + 1}:${nextState ? 1 : 0}`;

    await writeCommand(command);

    states[index] = nextState;
    showToast(`繼電器 ${index + 1} 指令已傳送`);
  } catch (error) {
    showToast(`傳送失敗：${error.message}`);
  } finally {
    busy = false;
    updateConnectionUI();
  }
}

async function setAllRelays(nextState) {
  if (!connected || busy) {
    showToast("請先連接 ESP32-S3");
    return;
  }

  busy = true;
  updateConnectionUI();

  let completed = 0;

  try {
    for (let i = 0; i < states.length; i++) {
      const command = `R${i + 1}:${nextState ? 1 : 0}`;

      await writeCommand(command);

      states[i] = nextState;
      completed++;

      renderRelays();

      // 留出短暫間隔，避免控制器收不到連續指令。
      if (i < states.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }
    }

    showToast(nextState
      ? "四路開啟指令已全部傳送"
      : "四路關閉指令已全部傳送"
    );
  } catch (error) {
    showToast(
      `已傳送 ${completed}/4 路；其餘失敗：${error.message}`
    );
  } finally {
    busy = false;
    updateConnectionUI();
  }
}

function handleDisconnect() {
  connected = false;
  characteristic = null;

  states.fill(false);

  updateConnectionUI();
  showToast("藍牙已斷線");

  if (device) {
    connectButton.textContent = "重新連線";
  }
}

async function connectDevice() {
  if (!navigator.bluetooth) {
    showToast("瀏覽器不支援 Web Bluetooth，請使用支援 BLE 的 Android Chrome");
    return;
  }

  if (connected && device?.gatt?.connected) {
    device.gatt.disconnect();
    handleDisconnect();
    return;
  }

  connectButton.disabled = true;

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [SERVICE_UUID] }
      ],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener(
      "gattserverdisconnected",
      handleDisconnect
    );

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    characteristic = await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

    connected = true;

    updateConnectionUI();
    showToast("ESP32-S3 連線成功");
  } catch (error) {
    connected = false;
    characteristic = null;
    updateConnectionUI();

    if (error.name === "NotFoundError") {
      showToast("未選擇裝置或沒有找到符合條件的裝置");
    } else {
      showToast(`連線失敗：${error.message}`);
    }
  } finally {
    connectButton.disabled = false;
  }
}

connectButton.addEventListener("click", connectDevice);

allOnButton.addEventListener("click", () => {
  setAllRelays(true);
});

allOffButton.addEventListener("click", () => {
  setAllRelays(false);
});

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  installPrompt = event;
  installButton.classList.remove("hidden");
});

installButton.addEventListener("click", async () => {
  if (!installPrompt) {
    showToast("請使用 Chrome 選單中的「加到主畫面」");
    return;
  }

  installPrompt.prompt();
  await installPrompt.userChoice;

  installPrompt = null;
  installButton.classList.add("hidden");
});

window.addEventListener("appinstalled", () => {
  installButton.classList.add("hidden");
  showToast("App 已安裝");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => {
        console.error("Service Worker 註冊失敗：", error);
      });
  });
}

updateConnectionUI();
</script>
</body>
</html>
